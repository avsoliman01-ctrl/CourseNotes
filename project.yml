# XcodeGen spec — run `xcodegen generate` on a Mac (or let the GitHub Actions workflow do it)
# to produce CourseNotes.xcodeproj. Change `bundleIdPrefix` to something unique to you,
# e.g. com.jdoe — free Apple IDs can't sign an ID someone else has already registered.
name: CourseNotes

options:
  bundleIdPrefix: com.yourname
  deploymentTarget:
    iOS: "17.5"
  developmentLanguage: en
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal

targets:
  CourseNotes:
    type: application
    platform: iOS
    deploymentTarget: "17.5"
    sources:
      - path: CourseNotes
    dependencies:
      # Auto-linked by `import PencilKit`; listed so the dependency is explicit.
      - sdk: PencilKit.framework
    settings:
      base:
        PRODUCT_NAME: CourseNotes
        # PRODUCT_BUNDLE_IDENTIFIER is derived from bundleIdPrefix: com.yourname.CourseNotes
        INFOPLIST_FILE: CourseNotes/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        # iPad only.
        TARGETED_DEVICE_FAMILY: "2"
        SUPPORTS_MACCATALYST: "NO"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: "NO"
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        # Your Personal Team ID (Xcode › Settings › Accounts), or pick the team in Xcode.
        DEVELOPMENT_TEAM: ""
        ENABLE_PREVIEWS: "YES"

schemes:
  CourseNotes:
    build:
      targets:
        CourseNotes: all
    run:
      config: Debug
    archive:
      config: Release
